# Security & hygiene hardening for the pharmacy website container.
# Loaded as an Apache conf-enabled snippet (see Dockerfile).

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Defense in depth: even if deployment/meta files ever end up in the
# document root, never serve dotfiles or common config/log extensions.
<FilesMatch "(^\.|\.(md|ini|log|sh|ya?ml|conf)$)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"
</IfModule>
