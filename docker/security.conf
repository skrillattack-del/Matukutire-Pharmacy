# Security & hygiene hardening for the pharmacy website container.
# Loaded as an Apache conf-enabled snippet (see Dockerfile).

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Defense in depth: even if deployment/meta files ever end up in the
# document root, never serve dotfiles or common config/log extensions.
<FilesMatch "(^\.|\.(md|ini|log|sh|ya?ml|conf)$)">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), camera=(), microphone=()"

    # Cache policy. Without this Apache sends only ETag/Last-Modified and browsers
    # apply heuristic freshness, which pins visitors to a stale main.js for hours
    # after a deploy. Pages always revalidate (cheap 304s); assets are referenced
    # with a ?v= query string, so a version bump is a new cache key and the old
    # entry simply goes unused.
    <FilesMatch "\.(html|php)$">
        Header always set Cache-Control "no-cache"
    </FilesMatch>
    # CSS and JS are referenced with ?v=N, so a bump is a fresh cache key.
    <FilesMatch "\.(css|js)$">
        Header always set Cache-Control "public, max-age=31536000"
    </FilesMatch>
    # Images and fonts are not version-stamped and do get replaced in place,
    # so keep their lifetime short enough that a swap actually reaches visitors.
    <FilesMatch "\.(woff2?|ttf|png|jpe?g|gif|svg|webp|ico)$">
        Header always set Cache-Control "public, max-age=86400"
    </FilesMatch>
</IfModule>
