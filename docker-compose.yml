services:
  web:
    build: .
    container_name: lomagundi-forestal-website
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - PORT=8080
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL=${OPENROUTER_MODEL:-}
      - OPENROUTER_PAID_MODEL=${OPENROUTER_PAID_MODEL:-}
    restart: unless-stopped
